<html lang="en">
<head>

    <style>

            font-family: Arial, sans-serif;
            margin: 40px;

        }

<body>
    <h1>Welcome, {{ user.Full_Name }}!</h1>

    <div>

    </div>

       <a href="{{ url_for('my_bookings') }}" class="button">My Bookings 📋</a>

    </div>

    <div>

    </div>

</html>
