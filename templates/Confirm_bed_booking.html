<!DOCTYPE html>
<html>
<head>
    <title>Confirm Bed Booking</title>
</head>
<body>
    <h2>Confirm Your Bed Booking</h2>

    <p><strong>Patient Name:</strong> {{ user.Full_Name }}</p>
    <p><strong>Hospital:</strong> {{ hospital.Name }}</p>
    <p><strong>Bed Type:</strong> {{ bed.Bed_Type }}</p>
    <p><strong>Status:</strong> {{ bed.Status }}</p>

    <form method="POST" action="{{ url_for('confirm_bed_booking_route', bed_id=bed.Bed_ID) }}">
        <button type="submit">Confirm & Pay</button>
    </form>

    <a href="{{ url_for('available_beds') }}">Back</a>
</body>
</html>
