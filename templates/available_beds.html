<h2>Available Beds in {{ bed_type }} on {{ selected_date }}</h2>

{% if bed_data %}
  {% for entry in bed_data %}
    <div class="card" style="margin-bottom: 15px; padding: 10px;">
      <h4>{{ entry.hospital.Name }}</h4>
      <p>Bed Type: {{ entry.bed_type }}</p>
      <p>Available Beds: {{ entry.count }}</p>

      <!-- ✅ GET request to confirmation page -->
      <a href="{{ url_for('confirm_bed_booking', bed_id=entry.one_bed_id) }}" class="btn btn-primary">
        Book Now
      </a>
    </div>
  {% endfor %}
{% else %}
  <p>No available beds found.</p>
{% endif %}
