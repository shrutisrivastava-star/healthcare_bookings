<h2>Available Beds in {{ bed_type }} on {{ selected_date }}</h2>

{% if beds %}
  <ul>
  {% for bed, hospital in beds %}
    <li>
      <strong>{{ bed.Bed_Type }}</strong> at {{ hospital.Name }} - Status: {{ bed.Status }}
      <form method="GET" action="{{ url_for('confirm_bed_booking', bed_id=bed.Bed_ID) }}">
        <button type="submit">Book</button>
      </form>
    </li>
  {% endfor %}
  </ul>
{% else %}
  <p>No available beds found in your city.</p>
{% endif %}
