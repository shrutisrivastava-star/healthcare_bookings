<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Bed</title>
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2980b9;
            --accent-color: #e74c3c;
            --light-color: #f5f7fa;
            --dark-color: #2c3e50;
            --success-color: #2ecc71;
            --border-radius: 8px;
            --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f0f2f5;
            color: var(--dark-color);
            line-height: 1.6;
        }
        
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .booking-card {
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 30px;
            transition: transform 0.3s ease;
        }
        
        .booking-card:hover {
            transform: translateY(-5px);
        }
        
        h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            text-align: center;
            font-size: 28px;
            position: relative;
            padding-bottom: 10px;
        }
        
        h2:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background-color: var(--primary-color);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark-color);
        }
        
        select, input[type="date"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        
        select:focus, input[type="date"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }
        
        .btn:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .info-box {
            background-color: var(--light-color);
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            margin-top: 25px;
            border-radius: 0 var(--border-radius) var(--border-radius) 0;
        }
        
        .info-box h3 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        
        .bed-types {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
        }
        
        .bed-type {
            flex: 1;
            min-width: 150px;
            padding: 15px;
            background-color: var(--light-color);
            border-radius: var(--border-radius);
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .bed-type:hover {
            background-color: #e8f4fc;
            transform: translateY(-3px);
        }
        
        .bed-type h4 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        
        .availability {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .available {
            background-color: rgba(46, 204, 113, 0.2);
            color: var(--success-color);
        }
        
        .limited {
            background-color: rgba(241, 196, 15, 0.2);
            color: #f39c12;
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 20px auto;
            }
            
            .booking-card {
                padding: 20px;
            }
            
            .bed-types {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="booking-card">
            <h2>Book a Bed</h2>
            
            <form method="POST" action="{{ url_for('book_bed_select') }}">
                <div class="form-group">
                    <label for="bed_type">Select Bed Type:</label>
                    <select name="bed_type" id="bed_type" required>
                        <option value="" disabled selected>Choose a bed type</option>
                        {% for type in bed_types %}
                        <option value="{{ type }}">{{ type }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="date">Select Date:</label>
                    <input type="date" name="date" id="date" required>
                </div>
                
                <button type="submit" class="btn">Search Available Beds</button>
            </form>
            
            <div class="info-box">
                <h3>Bed Types Information</h3>
                <p>We offer various bed types to suit your needs. Select a type and date to check availability.</p>
                
                <div class="bed-types">
                    <div class="bed-type">
                        <h4>Standard</h4>
                        <p>Comfortable single bed</p>
                        <span class="availability available">Available</span>
                    </div>
                    <div class="bed-type">
                        <h4>Premium</h4>
                        <p>Larger bed with extra amenities</p>
                        <span class="availability available">Available</span>
                    </div>
                    <div class="bed-type">
                        <h4>ICU</h4>
                        <p>Critical care specialized</p>
                        <span class="availability limited">Limited</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Set minimum date to today
        document.getElementById('date').min = new Date().toISOString().split('T')[0];
        
        // Add some interactivity to bed type selection
        const bedTypeSelect = document.getElementById('bed_type');
        const bedTypes = document.querySelectorAll('.bed-type');
        
        bedTypeSelect.addEventListener('change', function() {
            // Remove active class from all bed types
            bedTypes.forEach(type => {
                type.style.border = 'none';
            });
            
            // Find and highlight the selected bed type
            const selectedValue = this.value;
            bedTypes.forEach(type => {
                if (type.querySelector('h4').textContent === selectedValue) {
                    type.style.border = '2px solid var(--primary-color)';
                }
            });
        });
        
        // Initialize with today's date
        window.onload = function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date').value = today;
        };
    </script>
</body>
</html>
