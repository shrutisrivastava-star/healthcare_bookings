{% extends "base.html" %}

{% block content %}
<h1>Manage Beds</h1>
<a href="{{ url_for('staff_dashboard') }}" class="btn btn-secondary mb-3">Back to Dashboard</a>

<a href="{{ url_for('new_bed') }}" class="btn btn-primary">Add New Bed</a>

<table class="table table-bordered mt-3">
    <thead>
        <tr>
            <th>Bed Type</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for bed in beds %}
        <tr>
            <td>{{ bed.Bed_Type }}</td>
            <td>{{ bed.Status }}</td>
            <td>
                <a href="{{ url_for('edit_bed', bed_id=bed.Bed_ID) }}" class="btn btn-warning btn-sm">Edit</a>

                <!-- Delete form -->
                <form action="{{ url_for('delete_bed', bed_id=bed.Bed_ID) }}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger btn-sm"
                        onclick="return confirm('Are you sure you want to delete this bed?')">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="3">No beds found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
