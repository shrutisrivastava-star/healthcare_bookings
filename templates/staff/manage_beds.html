<!DOCTYPE html>
<html>
<head>
    <title>Manage Beds</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Manage Beds</h2>
    <a href="{{ url_for('new_bed') }}" class="btn btn-success mb-3">Add New Bed</a>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Bed ID</th>
                <th>Type</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for bed in beds %}
            <tr>
                <td>{{ bed.Bed_ID }}</td>
                <td>{{ bed.Bed_Type }}</td>
                <td>{{ bed.Status }}</td>
                <td>
                    <a href="{{ url_for('edit_bed', bed_id=bed.Bed_ID) }}" class="btn btn-warning btn-sm">Edit</a>
                    <form method="POST" action="{{ url_for('delete_bed', bed_id=bed.Bed_ID) }}" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="{{ url_for('staff_dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
</div>
</body>
</html>
