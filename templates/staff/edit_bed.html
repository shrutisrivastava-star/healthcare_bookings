<!DOCTYPE html>
<html>
<head>
    <title>Edit Bed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Edit Bed</h2>
    <form method="POST">
        <div class="mb-3">
            <label>Bed Type</label>
            <input type="text" name="bed_type" class="form-control" value="{{ bed.Bed_Type }}" required>
        </div>
        <div class="mb-3">
            <label>Status</label>
            <select name="status" class="form-select" required>
                <option value="available" {% if bed.Status=='available' %}selected{% endif %}>Available</option>
                <option value="booked" {% if bed.Status=='booked' %}selected{% endif %}>Booked</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Update Bed</button>
        <a href="{{ url_for('manage_beds') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
