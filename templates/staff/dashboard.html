<!DOCTYPE html>
<html>
<head>
    <title>Staff Dashboard</title>
    <!-- Bootstrap CSS (optional, for styling) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">Welcome, {{ user.Full_Name }}</h2>

    <!-- Hospital Info -->
    <div class="card mb-4 shadow p-3">
        <h5>Hospital: {{ hospital.Name }}</h5>
        <p><strong>Total Beds:</strong> {{ beds_count }}</p>
        <p><strong>Total Vaccines:</strong> {{ vaccines_count }}</p>
        <p><strong>Total Bookings:</strong> {{ bookings_count }}</p>
    </div>

    <!-- Action Buttons -->
    <div class="d-grid gap-3">
        <a href="{{ url_for('manage_beds') }}" class="btn btn-primary btn-lg">Manage Beds</a>
        <a href="{{ url_for('manage_vaccines') }}" class="btn btn-success btn-lg">Manage Vaccines</a>
        <a href="{{ url_for('staff_bookings') }}" class="btn btn-warning btn-lg">Manage Bookings</a>
        <a href="{{ url_for('staff_profile') }}" class="btn btn-info btn-lg text-white">View Profile</a>
        <a href="{{ url_for('logout') }}" class="btn btn-danger btn-lg">Logout</a>
    </div>
</div>

<!-- Bootstrap JS (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
