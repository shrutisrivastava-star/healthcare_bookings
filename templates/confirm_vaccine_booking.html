<h2>Confirm Vaccine Booking</h2>

<p><strong>Vaccine:</strong> {{ slot.Vaccine_Name }}</p>
<p><strong>Hospital:</strong> {{ slot.hospital.Name }}</p>
<p><strong>Date:</strong> {{appointment_date }}</p>
<p><strong>Time:</strong> {{ slot.Slot_Time }}</p>
<p><strong>Available Slots:</strong> {{ slot.Available }}</p>

<form method="POST" action="{{ url_for('book_vaccine_final', slot_id=slot.Slot_ID) }}">
  <input type="hidden" name="appointment_date" value="{{ session['selected_date'] }}">
  <button type="submit">Confirm & Pay</button>
</form>
